<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио — Али Тойчубеков</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0b0f; --card: #14141c; --accent: #ffd700; --neon: #7c7cff; }
body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; line-height: 1.6; }
header { text-align: center; padding: 90px 20px; background: radial-gradient(circle at top, #1a1a2e, #000); }
header h1 { font-size: 3em; margin-bottom: 10px; color: var(--accent); }
.tag { color: var(--neon); font-weight: 600; }
section { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
h2 { text-align: center; font-size: 2.4em; color: var(--accent); }
.ai-card { background: var(--card); border-radius: 22px; padding: 30px; text-align: center; border: 2px solid var(--neon); }
.ai-input { width: 85%; padding: 12px; border-radius: 10px; border: none; background: #0b0b0f; color: white; margin-bottom: 20px; border: 1px solid #333; }
.ai-button { padding: 12px 25px; background: var(--neon); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
#ai-image { width: 100%; max-width: 512px; margin-top: 25px; border-radius: 15px; display: none; border: 2px solid #333; }
.projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
.project { background: var(--card); border-radius: 22px; padding: 20px; }
video { width: 100%; border-radius: 15px; margin-top: 10px; background: #000; }
</style>
</head>
<body>

<header>
  <h1>Привет, я Али 👋</h1>
  <p><strong>Али Тойчубеков — 8 класс, школа Таалим</strong></p>
  <p class="tag">🎮 Scratch / Game Developer</p>
</header>

<section>
  <h2>BitDance AI Studio</h2>
  <div class="ai-card">
    <p>Генерация картинок через ИИ</p>
    <input type="text" id="ai-prompt" class="ai-input" placeholder="Опиши на английском (напр. Cyberpunk cat)...">
    <br>
    <button onclick="runAI()" id="ai-btn" class="ai-button">СГЕНЕРИРОВАТЬ</button>
    <p id="ai-status" style="margin-top: 15px; opacity: 0.7; color: var(--neon);"></p>
    <center><img id="ai-image" src="" alt="Результат"></center>
  </div>
</section>

<section>
<h2>Мои проекты</h2>
<div class="projects">
  <div class="project"><h3>#01 Scratch</h3><video controls><source src="./scratch1.mp4"></video></div>
  <div class="project"><h3>#02 Scratch</h3><video controls><source src="./scratch_project2.mp4"></video></div>
  <div class="project"><h3>#03 Scratch</h3><video controls><source src="./scratch_project.3.mp4"></video></div>
  <div class="project"><h3>#04 Scratch</h3><video controls><source src="./scratch_project4.mp4"></video></div>
  <div class="project"><h3>#05 Scratch</h3><video controls><source src="./scratch_project5.mp4"></video></div>
  <div class="project"><h3>#06 Scratch</h3><video controls><source src="./scratch_project6.mp4"></video></div>
  <div class="project"><h3>#07 Scratch</h3><video controls><source src="./scratch7.mp4"></video></div>
  <div class="project"><h3>#08 Scratch</h3><video controls><source src="./scratch8.mp4"></video></div>
  <div class="project"><h3>#09 Scratch</h3><video controls><source src="./scratch9.mp4"></video></div>
</div>
</section>

<script>
let savedToken = "";

async function runAI() {
    const prompt = document.getElementById('ai-prompt').value;
    const btn = document.getElementById('ai-btn');
    const status = document.getElementById('ai-status');
    const image = document.getElementById('ai-image');
    
    if (!prompt) return alert("Введите описание!");
    
    if (!savedToken) {
        savedToken = window.prompt("Введите ваш Hugging Face Token (hf_...):");
        if (!savedToken) return;
    }

    btn.disabled = true; 
    status.innerText = "⏳ Ждем нейросеть (около 40 сек)...";
    image.style.display = "none";

    try {
        const response = await fetch("https://api-inference.huggingface.co/models/shallowdream204/bitdance", {
            headers: { "Authorization": "Bearer " + savedToken.trim() },
            method: "POST",
            body: JSON.stringify({ inputs: prompt }),
        });

        if (response.status === 503) {
            status.innerText = "🛰️ Модель грузится. Нажми еще раз через 30 сек.";
            return;
        }

        if (!response.ok) {
            savedToken = ""; 
            status.innerText = "❌ Ошибка. Токен неверный или заблокирован.";
            return;
        }

        const blob = await response.blob();
        image.src = URL.createObjectURL(blob);
        image.style.display = "inline-block";
        status.innerText = "✅ Готово!";
    } catch (err) { 
        status.innerText = "❌ Ошибка соединения.";
    } finally { btn.disabled = false; }
}
</script>
</body>
</html>
