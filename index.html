<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Али Тойчубеков</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0b0f; --card: #14141c; --accent: #ffd700; --neon: #7c7cff; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; text-align: center; }
        header { padding: 60px 20px; background: radial-gradient(circle at top, #1a1a2e, #000); }
        .ai-card { background: var(--card); border-radius: 20px; padding: 30px; border: 2px solid var(--neon); margin: 20px auto; max-width: 800px; box-shadow: 0 0 20px rgba(124, 124, 255, 0.2); }
        .ai-input { width: 80%; padding: 12px; border-radius: 10px; background: #000; color: #fff; border: 1px solid #333; margin-bottom: 20px; outline: none; }
        .ai-input:focus { border-color: var(--neon); }
        .ai-btn { padding: 12px 30px; background: var(--neon); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .ai-btn:hover { opacity: 0.8; transform: scale(1.05); }
        .ai-btn:disabled { background: #444; cursor: not-allowed; }
        #ai-res { width: 100%; max-width: 512px; margin-top: 25px; border-radius: 15px; display: none; border: 1px solid #333; }
        #status { margin-top: 15px; color: var(--neon); font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

<header>
    <h1>Привет, я Али 👋</h1>
    <p>Scratch Developer | AI Enthusiast</p>
</header>

<section>
    <h2>AI Image Studio</h2>
    <div class="ai-card">
        <input type="text" id="prompt" class="ai-input" placeholder="Опишите картинку на английском (например: neon cat)...">
        <br>
        <button onclick="runModel()" id="btn" class="ai-btn">СГЕНЕРИРОВАТЬ</button>
        <p id="status"></p>
        <div style="display: flex; justify-content: center;">
            <img id="ai-res" src="" alt="Результат генерации">
        </div>
    </div>
</section>

<script>
async function runModel() {
    const promptInput = document.getElementById('prompt').value;
    const button = document.getElementById('btn');
    const statusText = document.getElementById('status');
    const resultImg = document.getElementById('ai-res');

    if (!promptInput) {
        alert("Введите описание на английском!");
        return;
    }

    button.disabled = true;
    statusText.innerText = "⏳ Нейросеть генерирует через прокси... (около 30 сек)";
    statusText.style.color = "#7c7cff";
    resultImg.style.display = "none";

    // Токен (hf_wsVC...)
    const apiToken = "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";
    
    // Ссылка с прокси
    const url = "https://cors-anywhere.herokuapp.com/https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell";

    try {
        const response = await fetch(url, {
            method: "POST",
            headers: { 
                "Authorization": "Bearer " + apiToken.trim(),
                "Content-Type": "application/json",
                "X-Requested-With": "XMLHttpRequest"
            },
            body: JSON.stringify({ inputs: promptInput }),
        });

        if (!response.ok) {
            if (response.status === 403) {
                throw new Error("Нужно нажать кнопку активации на сайте cors-anywhere!");
            }
            if (response.status === 401) {
                throw new Error("Токен не подходит. Создай новый Token на Hugging Face.");
            }
            throw new Error(`Ошибка сервера: ${response.status}`);
        }

        const blob = await response.blob();
        
        if (blob.size < 1000) {
             throw new Error("Ошибка: получена пустая картинка. Попробуй еще раз.");
        }

        const imageUrl = URL.createObjectURL(blob);
        resultImg.src = imageUrl;
        resultImg.style.display = "block";
        statusText.innerText = "✅ Готово!";
        statusText.style.color = "#00ff00";

    } catch (err) {
        console.error("Ошибка:", err);
        statusText.innerText = "❌ " + err.message;
        statusText.style.color = "#ff4c4c";
    } finally {
        button.disabled = false;
    }
}
</script>

</body>
</html>
