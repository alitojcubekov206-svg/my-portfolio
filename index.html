<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио — Али Тойчубеков</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0b0f; --card: #14141c; --accent: #ffd700; --neon: #7c7cff; }
body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; }
header { text-align: center; padding: 60px 20px; background: radial-gradient(circle at top, #1a1a2e, #000); }
header h1 { font-size: 3em; color: var(--accent); margin: 0; }
section { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
.ai-card { background: var(--card); border-radius: 20px; padding: 30px; text-align: center; border: 2px solid var(--neon); }
.ai-input { width: 80%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; margin-bottom: 20px; }
.ai-button { padding: 12px 30px; background: var(--neon); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
#ai-image { width: 100%; max-width: 500px; margin-top: 20px; border-radius: 15px; display: none; }
.projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
.project { background: var(--card); padding: 15px; border-radius: 20px; text-align: center; }
video { width: 100%; border-radius: 10px; }
</style>
</head>
<body>

<header>
  <h1>Привет, я Али 👋</h1>
  <p>8 класс, школа Таалим | Game Developer</p>
</header>

<section>
  <div class="ai-card">
    <h2>BitDance AI Studio</h2>
    <input type="text" id="ai-prompt" class="ai-input" placeholder="Опиши картинку на английском...">
    <br>
    <button onclick="runAI()" id="ai-btn" class="ai-button">СГЕНЕРИРОВАТЬ</button>
    <p id="ai-status" style="margin-top: 15px; color: var(--neon);"></p>
    <center><img id="ai-image" src="" alt="Результат"></center>
  </div>

  <div class="projects">
    <div class="project"><h3>#01 Scratch</h3><video controls><source src="./scratch1.mp4"></video></div>
    <div class="project"><h3>#02 Scratch</h3><video controls><source src="./scratch_project2.mp4"></video></div>
    <div class="project"><h3>#03 Scratch</h3><video controls><source src="./scratch_project.3.mp4"></video></div>
    </div>
</section>

<script>
let mySecretToken = "";

async function runAI() {
    const prompt = document.getElementById('ai-prompt').value;
    const btn = document.getElementById('ai-btn');
    const status = document.getElementById('ai-status');
    const image = document.getElementById('ai-image');

    if (!prompt) return alert("Введите описание!");

    // Если токена еще нет в памяти этой вкладки, спрашиваем его
    if (!mySecretToken) {
        mySecretToken = window.prompt("Введите ваш рабочий токен Hugging Face (hf_...):");
        if (!mySecretToken) return;
    }

    btn.disabled = true;
    status.innerText = "⏳ Нейросеть просыпается... Жди 40-60 сек.";
    image.style.display = "none";

    try {
        const response = await fetch("https://api-inference.huggingface.co/models/shallowdream204/bitdance", {
            headers: { "Authorization": "Bearer " + mySecretToken.trim() },
            method: "POST",
            body: JSON.stringify({ inputs: prompt }),
        });

        if (response.status === 503) {
            status.innerText = "🛰️ Модель еще грузится. Нажми кнопку еще раз через 30 секунд!";
            return;
        }

        if (!response.ok) {
            mySecretToken = ""; // Сбрасываем, если токен оказался плохим
            status.innerText = "❌ Ошибка! Токен не подошел (возможно, он заблокирован).";
            return;
        }

        const blob = await response.blob();
        image.src = URL.createObjectURL(blob);
        image.style.display = "inline-block";
        status.innerText = "✅ Готово!";
    } catch (err) {
        status.innerText = "❌ Ошибка соединения.";
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
