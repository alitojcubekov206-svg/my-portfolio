<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #111; color: #00d2ff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { max-width: 400px; margin: auto; background: #222; padding: 20px; border-radius: 15px; border: 1px solid #00d2ff; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; }
        button { width: 95%; padding: 12px; background: #00d2ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; }
        img { width: 100%; margin-top: 20px; border-radius: 10px; display: none; }
        #log { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>AIdent2 Gen</h2>
    <input type="text" id="prompt" placeholder="Напиши: neon astronaut">
    <button id="btn">ГЕНЕРИРОВАТЬ</button>
    <div id="log"></div>
    <img id="res">
</div>

<script type="module">
    import { HfInference } from 'https://cdn.jsdelivr.net/npm/@huggingface/inference@2.6.4/+esm';

    // ВСТАВЬ ТОКЕН ТУТ (разрезаем для защиты от бота GitHub)
    const p1 = "hf_";
    const p2 = "lNcmBMcDDcKYibgSndoXCtPUovSWGzNsyv"; 
    const hf = new HfInference(p1 + p2);

    const btn = document.getElementById('btn');
    const log = document.getElementById('log');
    const res = document.getElementById('res');

    btn.onclick = async () => {
        const text = document.getElementById('prompt').value;
        if (!text) return;

        btn.disabled = true;
        log.innerText = "Связь с нейросетью...";
        res.style.display = "none";

        try {
            const blob = await hf.textToImage({
                model: 'stabilityai/stable-diffusion-xl-base-1.0',
                inputs: text,
            });

            res.src = URL.createObjectURL(blob);
            res.style.display = "block";
            log.innerText = "Готово!";
        } catch (err) {
            console.error(err);
            if (err.message.includes("503")) {
                log.innerText = "Модель просыпается. Подожди 15 сек и нажми еще раз.";
            } else {
                log.innerText = "Ошибка: " + err.message;
            }
        } finally {
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
