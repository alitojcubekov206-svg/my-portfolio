<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIdent2 Generator</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #2a2a2a; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 450px; }
        h1 { color: #00d2ff; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: none; background: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #00d2ff; color: #1a1a1a; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; }
        #result { margin-top: 20px; width: 100%; border-radius: 10px; display: none; }
        .loader { display: none; margin: 20px auto; border: 4px solid #333; border-top: 4px solid #00d2ff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>AIdent2 Gen</h1>
    <input type="text" id="promptInput" placeholder="Опишите на английском (neon, space...)">
    <button id="generateBtn">Сгенерировать</button>
    <div class="loader" id="loader"></div>
    <div id="status"></div>
    <img id="result" src="" alt="">
</div>

<script>
    // 1. ВСТАВЬ ХВОСТ ТОКЕНА ТУТ (БЕЗ hf_)
    const p1 = "hf_";
    const p2 = "lNcmBMcDDcKYibgSndoXCtPUovSWGzNsyv"; 
    const token = p1 + p2;

    const modelId = "stabilityai/stable-diffusion-xl-base-1.0";

    const btn = document.getElementById('generateBtn');
    const input = document.getElementById('promptInput');
    const resultImg = document.getElementById('result');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');

    async function query(data) {
        const response = await fetch(
            `https://api-inference.huggingface.co/models/${modelId}`,
            {
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify(data),
            }
        );
        
        if (!response.ok) {
            throw new Error("Модель грузится... Жмите еще раз через 20 сек.");
        }
        return await response.blob();
    }

    btn.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) return alert("Пусто!");

        btn.disabled = true;
        loader.style.display = "block";
        resultImg.style.display = "none";
        status.innerText = "Рисую...";

        try {
            const blob = await query({ "inputs": text });
            resultImg.src = URL.createObjectURL(blob);
            resultImg.style.display = "block";
            status.innerText = "Готово!";
        } catch (err) {
            status.innerText = err.message;
        } finally {
            btn.disabled = false;
            loader.style.display = "none";
        }
    });
</script>

</body>
</html>
