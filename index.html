<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Али Тойчубеков</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0b0f; --card: #14141c; --accent: #ffd700; --neon: #7c7cff; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; text-align: center; }
        header { padding: 80px 20px; background: radial-gradient(circle at top, #1a1a2e, #000); }
        h1 { font-size: 3em; color: var(--accent); margin-bottom: 10px; }
        .tag { color: var(--neon); font-weight: 600; letter-spacing: 1px; }
        section { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .project { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; }
        video { width: 100%; border-radius: 15px; background: #000; }
        h3 { color: var(--accent); }
    </style>
</head>
<body>
    <header>
        <h1>Привет, я Али 👋</h1>
        <p><strong>Али Тойчубеков — 8 класс, школа Таалим</strong></p>

    <section>

        <div class="projects">
            <div class="project"><h3>#01 Scratch</h3><video controls><source src="./scratch1.mp4"></video></div>

            <div class="project"><h3>#03 Scratch</h3><video controls><source src="./scratch_project.3.mp4"></video></div>
            <div class="project"><h3>#04 Scratch</h3><video controls><source src="./scratch_project4.mp4"></video></div>
            <div class="project"><h3>#05 Scratch</h3><video controls><source src="./scratch_project5.mp4"></video></div>
            <div class="project"><h3>#06 Scratch</h3><video controls><source src="./scratch_project6.mp4"></video></div>
            <div class="project"><h3>#07 Scratch</h3><video controls><source src="./scratch7.mp4"></video></div>
            <div class="project"><h3>#08 Scratch</h3><video controls><source src="./scratch8.mp4"></video></div>
            <div class="project"><h3>#09 Scratch</h3><video controls><source src="./scratch9.mp4"></video></div>
        </div>

    <footer style="padding: 50px; opacity: 0.6;">
        <p>Связаться со мной: <a href="https://t.me/Reason65" style="color: var(--neon);">Telegram</a></p>

</html>
