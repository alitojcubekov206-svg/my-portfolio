<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generator | Fixed Version</title>
    <style>
        :root {
            --primary: #8a2be2;
            --bg: #0f0f12;
            --card: #1a1a20;
            --text: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #333;
        }

        h1 { margin-bottom: 1.5rem; font-size: 1.8rem; }

        .input-group { display: flex; flex-direction: column; gap: 15px; }

        input {
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #2a2a35;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(138, 43, 226, 0.3); }

        button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: #444; cursor: not-allowed; transform: none; }

        #result-container {
            margin-top: 25px;
            min-height: 300px;
            background: #000;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid #333;
            overflow: hidden;
        }

        #result-img { width: 100%; height: auto; display: none; }

        .loader { display: none; position: absolute; color: var(--primary); font-weight: bold; }
        
        .reset-btn { margin-top: 15px; font-size: 11px; color: #555; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор FLUX.1</h1>
    
    <div class="input-group">
        <input type="text" id="prompt" placeholder="Напишите запрос (на английском)..." autocomplete="off">
        <button id="gen-btn">Создать изображение</button>
    </div>

    <div id="result-container">
        <div id="loader" class="loader">✨ Магия в процессе...</div>
        <span id="placeholder" style="color: #444;">Здесь появится ваш результат</span>
        <img id="result-img" alt="Результат генерации">
    </div>

    <div class="reset-btn" onclick="resetToken()">Сменить API Токен</div>
</div>

<script>
    // 1. Проверка токена в локальном хранилище
    let HF_TOKEN = localStorage.getItem('hf_token_v2');

    if (!HF_TOKEN) {
        HF_TOKEN = prompt("Введите ваш новый Hugging Face API Token (Read):");
        if (HF_TOKEN) {
            localStorage.setItem('hf_token_v2', HF_TOKEN.trim());
        }
    }

    // Используем стабильную ссылку
    const API_URL = "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell";

    async function generate() {
        const promptInput = document.getElementById('prompt');
        const btn = document.getElementById('gen-btn');
        const loader = document.getElementById('loader');
        const resultImg = document.getElementById('result-img');
        const placeholder = document.getElementById('placeholder');

        if (!promptInput.value.trim()) return alert("Введите описание картинки!");
        if (!HF_TOKEN) return location.reload();

        // Сброс интерфейса
        btn.disabled = true;
        loader.style.display = "block";
        resultImg.style.display = "none";
        placeholder.style.display = "none";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${HF_TOKEN}`
                    // ВАЖНО: Убрали Content-Type для обхода CORS
                },
                body: JSON.stringify({ inputs: promptInput.value.trim() }),
            });

            if (!response.ok) {
                const err = await response.json();
                if (response.status === 401) {
                    resetToken("Токен неверный или забанен. Введите новый.");
                }
                throw new Error(err.error || "Ошибка сервера");
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            
            resultImg.src = url;
            resultImg.style.display = "block";
            loader.style.display = "none";

        } catch (error) {
            console.error(error);
            alert("Ошибка: " + error.message);
            placeholder.style.display = "block";
            loader.style.display = "none";
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('gen-btn').addEventListener('click', generate);

    // Позволяет нажать Enter для генерации
    document.getElementById('prompt').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') generate();
    });

    function resetToken(msg = "") {
        if (msg) alert(msg);
        localStorage.removeItem('hf_token_v2');
        location.reload();
    }
</script>

</body>
</html>
