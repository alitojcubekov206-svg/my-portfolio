<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio - Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d12; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-2xl w-full text-center space-y-8">
        <h1 class="text-4xl font-bold tracking-tight text-indigo-400">Привет, я Али 👋</h1>
        
        <div class="glass p-6 rounded-2xl mb-4">
            <p class="text-xs text-gray-400 mb-2">Вставь свой токен (он сохранится в браузере):</p>
            <input type="password" id="hfToken" placeholder="hf_..." 
                class="w-full bg-black/40 border border-gray-700 rounded-lg px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500">
        </div>

        <div class="glass p-8 rounded-3xl shadow-2xl space-y-6">
            <h2 class="text-2xl font-semibold">AI Image Studio</h2>
            <input type="text" id="prompt" placeholder="Опиши картинку на английском..." 
                class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white">

            <button id="genBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95">
                СГЕНЕРИРОВАТЬ
            </button>

            <div id="status" class="mt-4 text-sm text-indigo-300"></div>

            <div id="resultContainer" class="hidden mt-6">
                <div id="loading" class="flex flex-col items-center space-y-2">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
                    <p class="text-sm text-gray-400">Нейронка просыпается...</p>
                </div>
                <img id="outputImage" class="hidden w-full rounded-2xl border border-gray-800 shadow-2xl" src="">
            </div>
        </div>
    </div>

<script>
    const tokenInput = document.getElementById('hfToken');
    const promptInput = document.getElementById('prompt');
    const btn = document.getElementById('genBtn');
    const status = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const loader = document.getElementById('loading');
    const img = document.getElementById('outputImage');

    tokenInput.value = localStorage.getItem('user_hf_token') || '';

    btn.onclick = async () => {
        const token = tokenInput.value.trim();
        const prompt = promptInput.value.trim();

        if (!token || !prompt) return alert("Вставь токен и напиши текст!");

        localStorage.setItem('user_hf_token', token);

        btn.disabled = true;
        status.innerText = "Генерирую... Это может занять до 30 секунд.";
        resultContainer.classList.remove('hidden');
        loader.classList.remove('hidden');
        img.classList.add('hidden');

        try {
            // ИСПОЛЬЗУЕМ КЛАССИЧЕСКИЙ АДРЕС API
            const response = await fetch(
                "https://api-inference.huggingface.co/models/runwayml/stable-diffusion-v1-5",
                {
                    headers: { 
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json" 
                    },
                    method: "POST",
                    body: JSON.stringify({ inputs: prompt }),
                }
            );

            if (response.status === 503) {
                status.innerText = "Модель просыпается... Нажми кнопку еще раз через 15 секунд.";
                throw new Error("Model loading");
            }

            if (!response.ok) {
                const errText = await response.text();
                throw new Error("Ошибка API. Проверь токен.");
            }

            const blob = await response.blob();
            img.src = URL.createObjectURL(blob);
            img.classList.remove('hidden');
            status.innerText = "Готово! 🔥";
        } catch (err) {
            if (err.message !== "Model loading") {
                status.innerText = "Ошибка: " + err.message;
            }
        } finally {
            btn.disabled = false;
            loader.classList.add('hidden');
        }
    };
</script>
</body>
</html>
