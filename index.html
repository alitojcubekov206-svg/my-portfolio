<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator | Secure Version</title>
    <style>
        :root {
            --primary: #8a2be2;
            --bg: #0f0f12;
            --card: #1a1a20;
            --text: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #333;
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #2a2a35;
            color: white;
            outline: none;
        }

        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { background: #555; }

        #result-container {
            margin-top: 20px;
            min-height: 250px;
            border: 2px dashed #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #result-img { width: 100%; display: none; }

        .loader { display: none; margin: 15px; color: var(--primary); }
        
        .token-status { font-size: 10px; margin-top: 10px; color: #666; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор FLUX.1</h1>
    
    <div class="input-group">
        <input type="text" id="prompt" placeholder="Опиши картинку (на англ)...">
        <button id="gen-btn">Сгенерировать</button>
    </div>

    <div id="loader" class="loader">🎨 Рисую... (ждем 15-20 сек)</div>

    <div id="result-container">
        <span id="placeholder" style="color: #555;">Картинка появится здесь</span>
        <img id="result-img">
    </div>

    <div class="token-status" onclick="resetToken()">Сбросить API токен</div>
</div>

<script>
    // ПРОВЕРКА ТОКЕНА
    let HF_TOKEN = localStorage.getItem('hf_api_token');

    if (!HF_TOKEN) {
        HF_TOKEN = prompt("GitHub забанил прошлый токен. Создай НОВЫЙ на Hugging Face и вставь сюда:");
        if (HF_TOKEN) {
            localStorage.setItem('hf_api_token', HF_TOKEN);
        }
    }

    const API_URL = "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell";

    async function generate() {
        const promptInput = document.getElementById('prompt');
        const btn = document.getElementById('gen-btn');
        const loader = document.getElementById('loader');
        const resultImg = document.getElementById('result-img');
        const placeholder = document.getElementById('placeholder');

        if (!promptInput.value) return alert("Введите текст!");
        if (!HF_TOKEN) return alert("Нужен токен!");

        btn.disabled = true;
        loader.style.display = "block";
        resultImg.style.display = "none";
        placeholder.style.display = "none";

        try {
            const response = await fetch(API_URL, {
                headers: { 
                    Authorization: `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({ inputs: promptInput.value }),
            });

            if (response.status === 401) {
                alert("Токен неверный или забанен. Нажми 'Сбросить' внизу и введи новый.");
                throw new Error("401");
            }

            const blob = await response.blob();
            resultImg.src = URL.createObjectURL(blob);
            resultImg.style.display = "block";
        } catch (err) {
            console.error(err);
            placeholder.style.display = "block";
        } finally {
            btn.disabled = false;
            loader.style.display = "none";
        }
    }

    document.getElementById('gen-btn').onclick = generate;

    function resetToken() {
        localStorage.removeItem('hf_api_token');
        location.reload();
    }
</script>

</body>
</html>
