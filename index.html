<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI Image Studio - GitHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background-color:#0d0d12; color:white; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.1); padding:20px; border-radius:2rem; max-width:500px; width:100%; }
.loader { border:4px solid #f3f3f3; border-top:4px solid #6366f1; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:auto; }
@keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
img { max-width:100%; border-radius:1rem; margin-top:20px; border:1px solid #555; }
</style>
</head>
<body>
<div class="glass">
  <h1 class="text-2xl text-indigo-400 font-bold text-center mb-4">AI Image Studio</h1>
  <input type="password" id="token" placeholder="HF Token" class="w-full p-2 mb-2 rounded-lg bg-black/50 text-white border border-gray-700">
  <input type="text" id="prompt" placeholder="Describe image (English)" class="w-full p-2 mb-2 rounded-lg bg-black/50 text-white border border-gray-700">
  <button id="btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg font-bold mb-2">Generate</button>
  <div id="status" class="text-sm text-gray-400 text-center mb-2"></div>
  <div id="loading" class="hidden"><div class="loader"></div></div>
  <img id="output" class="hidden">
</div>

<script>
const btn = document.getElementById('btn');
const tokenInp = document.getElementById('token');
const promptInp = document.getElementById('prompt');
const status = document.getElementById('status');
const loading = document.getElementById('loading');
const output = document.getElementById('output');

btn.onclick = async () => {
    const token = tokenInp.value.trim();
    const prompt = promptInp.value.trim();
    if(!token || !prompt){ alert("Заполни все поля!"); return; }

    localStorage.setItem('hf_token_ali', token);
    btn.disabled = true;
    status.innerText = "Generating... (wait 10-30 sec)";
    loading.classList.remove('hidden');
    output.classList.add('hidden');

    try {
        const response = await fetch(
            "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2",
            {
                method:"POST",
                headers:{ "Authorization":`Bearer ${token}`, "Content-Type":"application/json" },
                body: JSON.stringify({ inputs: prompt, options:{ wait_for_model:true } })
            }
        );
        if(!response.ok){
            const err = await response.json();
            status.innerText = "Error: " + (err.error || response.status);
        } else {
            const blob = await response.blob();
            output.src = URL.createObjectURL(blob);
            output.classList.remove('hidden');
            status.innerText = "Done! 🔥";
        }
    } catch(e){
        status.innerText = "Network error";
        console.error(e);
    } finally{
        btn.disabled = false;
        loading.classList.add('hidden');
    }
};

// Автозагрузка токена
tokenInp.value = localStorage.getItem('hf_token_ali') || '';
</script>
</body>
</html>
