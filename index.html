<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            color: #333;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: #222;
            color: #fff;
        }
        h1 {
            margin: 0;
        }
        section {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .projects {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .project {
            background: #fff;
            padding: 20px;
            flex: 1 1 300px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .project button {
            margin-top: 10px;
            padding: 10px 15px;
            background: #222;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .contacts {
            text-align: center;
        }
        .contacts a {
            margin: 0 10px;
            text-decoration: none;
            color: #222;
        }
        @media(max-width: 700px){
            .projects {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<section class="projects">
    <h2>Мои проекты</h2>
    <div class="projects">

            <h3>Проект 1</h3>

        </div>

        </div>
        <div class="project">
            <h3>Проект 3</h3>
            <p>Описание проекта 3. Коротко о том, что это за проект.</p>
            <button>Посмотреть</button>
        </div>
    </div>
</section>

<section class="contacts">
    <h2>Контакты</h2>
    <p>Email: <a href="mailto:example@mail.com">example@mail.com</a></p>
    <p>
        <a href="https://github.com/username" target="_blank">GitHub</a>
        |
        <a href="https://linkedin.com/in/username" target="_blank">LinkedIn</a>
    </p>
</section>

</body>
</html>
