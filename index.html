<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Image Studio - Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d12; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass p-8 rounded-3xl shadow-2xl space-y-6">
        <h1 class="text-3xl font-bold text-center text-indigo-400">AI Studio 👋</h1>
        
        <div>
            <label class="text-xs text-gray-400">HF Token:</label>
            <input type="password" id="token" class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 text-white mt-1">
        </div>

        <input type="text" id="prompt" placeholder="Describe image (English)" class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-4 text-white">

        <button id="btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all">
            СГЕНЕРИРОВАТЬ
        </button>

        <div id="status" class="text-center text-sm text-gray-400"></div>
        <div id="loading" class="hidden flex justify-center"><div class="loader"></div></div>
        <img id="output" class="hidden w-full rounded-xl border border-gray-700 mt-4 shadow-2xl">
    </div>

    <script>
        const btn = document.getElementById('btn');
        const tokenInp = document.getElementById('token');
        const promptInp = document.getElementById('prompt');
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        const loading = document.getElementById('loading');

        tokenInp.value = localStorage.getItem('hf_token_ali') || '';

        btn.onclick = async () => {
            const token = tokenInp.value.trim();
            const prompt = promptInp.value.trim();
            if (!token || !prompt) return alert("Заполни поля!");

            localStorage.setItem('hf_token_ali', token);
            btn.disabled = true;
            status.innerText = "Генерирую... (до 30 сек)";
            loading.classList.remove('hidden');
            output.classList.add('hidden');

            try {
                // Используем модель, которая почти всегда онлайн
                const modelUrl = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0";
                
                const response = await fetch(modelUrl, {
                    headers: { "Authorization": `Bearer ${token}` },
                    method: "POST",
                    body: JSON.stringify({ inputs: prompt }),
                });

                if (response.status === 503) {
                    status.innerText = "Модель грузится. Подожди 15 сек и нажми еще раз.";
                } else if (!response.ok) {
                    const err = await response.json();
                    status.innerText = "Ошибка: " + (err.error || response.status);
                } else {
                    const blob = await response.blob();
                    output.src = URL.createObjectURL(blob);
                    output.classList.remove('hidden');
                    status.innerText = "Готово! 🔥";
                }
            } catch (e) {
                status.innerText = "Ошибка сети. Проверь интернет.";
                console.error(e);
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
