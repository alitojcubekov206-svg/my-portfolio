<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d12; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-2xl w-full text-center space-y-8">
        <h1 class="text-4xl font-bold tracking-tight">Привет, я Али 👋</h1>
        <p class="text-gray-400 text-lg">Scratch Developer | AI Enthusiast</p>

        <div class="glass p-8 rounded-3xl shadow-2xl space-y-6">
            <h2 class="text-2xl font-semibold">AI Image Studio</h2>
            
            <div class="relative">
                <input type="text" id="prompt" placeholder="Опиши картинку (на английском)..." 
                    class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>

            <button onclick="generateImage()" id="genBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all transform active:scale-95">
                СГЕНЕРИРОВАТЬ
            </button>

            <div id="errorBox" class="hidden text-red-500 font-medium">❌ Ошибка: <span id="errorMsg"></span></div>

            <div id="resultContainer" class="hidden mt-6 space-y-4">
                <div id="loading" class="flex flex-col items-center space-y-2">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
                    <p class="text-sm text-gray-400">Нейронка думает...</p>
                </div>
                <img id="outputImage" class="hidden w-full rounded-2xl shadow-lg border border-gray-800" src="" alt="Generated">
                <a id="downloadBtn" class="hidden inline-block text-indigo-400 hover:text-indigo-300 text-sm font-medium underline">Скачать результат</a>
            </div>
        </div>
    </div>

    <script>
        // ЗАМЕНИ ЭТО НА СВОЙ ТОКЕН С HUGGING FACE
        const HF_TOKEN = "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"; 
        const MODEL_ID = "stabilityai/stable-diffusion-2-1";

        async function generateImage() {
            const promptInput = document.getElementById('prompt');
            const btn = document.getElementById('genBtn');
            const resultCont = document.getElementById('resultContainer');
            const loader = document.getElementById('loading');
            const img = document.getElementById('outputImage');
            const errorBox = document.getElementById('errorBox');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!promptInput.value) return alert("Введите запрос!");

            // Сброс состояния
            btn.disabled = true;
            btn.innerText = "В ПРОЦЕССЕ...";
            errorBox.classList.add('hidden');
            resultCont.classList.remove('hidden');
            loader.classList.remove('hidden');
            img.classList.add('hidden');
            downloadBtn.classList.add('hidden');

            try {
                const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${HF_TOKEN}`,
                    },
                    body: JSON.stringify({ inputs: promptInput.value }),
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || "Ошибка API");
                }

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                
                img.src = objectUrl;
                img.classList.remove('hidden');
                downloadBtn.href = objectUrl;
                downloadBtn.download = "ai-image.png";
                downloadBtn.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('errorMsg').innerText = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "СГЕНЕРИРОВАТЬ";
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
