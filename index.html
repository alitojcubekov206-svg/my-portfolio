<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Image Generator - AIdent2</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .box { background: #2a2a2a; padding: 20px; border-radius: 15px; display: inline-block; }
        input { padding: 10px; width: 250px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
        #output { margin-top: 20px; min-height: 200px; }
        img { max-width: 100%; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .loader { display: none; color: #ffcc00; }
    </style>
</head>
<body>

    <h1>Проект AIdent2</h1>
    <div class="box">
        <input type="text" id="promptInput" placeholder="Введите запрос (на англ.)...">
        <button id="genBtn">Сгенерировать</button>
        <p class="loader" id="loader">Нейросеть рисует... Подождите 15 сек.</p>
        <div id="output"></div>
    </div>

    <script>
        // Шаг 1: Работа с токеном (как в инструкции учителя)
        let HF_TOKEN = localStorage.getItem('hf_token');
        if (!HF_TOKEN) {
            HF_TOKEN = prompt("Введите ваш Hugging Face API Token:");
            if (HF_TOKEN) localStorage.setItem('hf_token', HF_TOKEN.trim());
        }

        // Шаг 2: ID модели (Stable Diffusion v1.5 самая стабильная для учебных проектов)
        const MODEL_ID = "runwayml/stable-diffusion-v1-5";

        // Шаг 3: Написание кода (функция fetch)
        async function queryModel(data) {
            const response = await fetch(
                `https://api-inference.huggingface.co/models/${MODEL_ID}`,
                {
                    headers: { 
                        "Authorization": `Bearer ${HF_TOKEN}`,
                        "Content-Type": "application/json" 
                    },
                    method: "POST",
                    body: JSON.stringify(data),
                }
            );
            
            // Если модель еще грузится на сервере
            if (response.status === 503) {
                alert("Модель загружается на сервере HF, подождите минуту и нажмите еще раз.");
                return null;
            }

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || "Ошибка API");
            }

            return await response.blob();
        }

        // Обработка клика
        document.getElementById('genBtn').onclick = async () => {
            const input = document.getElementById('promptInput').value;
            const loader = document.getElementById('loader');
            const output = document.getElementById('output');

            if (!input) return alert("Введите текст!");

            loader.style.display = "block";
            output.innerHTML = "";

            try {
                const blob = await queryModel({ "inputs": input });
                if (blob) {
                    const imgUrl = URL.createObjectURL(blob);
                    output.innerHTML = `<img src="${imgUrl}" alt="AI Result">`;
                }
            } catch (error) {
                alert("Ошибка: " + error.message);
                console.error(error);
            } finally {
                loader.style.display = "none";
            }
        };

        // Кнопка для сброса токена (на всякий случай)
        console.log("Чтобы сбросить токен, введите в консоли: localStorage.clear(); location.reload();");
    </script>
</body>
</html>
