<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портфолио — Али Тойчубеков</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0b0f; --card: #14141c; --accent: #ffd700; --neon: #7c7cff; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; text-align: center; }
        header { padding: 60px 20px; background: radial-gradient(circle at top, #1a1a2e, #000); }
        .ai-card { background: var(--card); border-radius: 20px; padding: 30px; border: 2px solid var(--neon); margin: 20px auto; max-width: 800px; }
        .ai-input { width: 80%; padding: 12px; border-radius: 10px; background: #000; color: #fff; border: 1px solid #333; margin-bottom: 20px; }
        .ai-btn { padding: 12px 30px; background: var(--neon); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #ai-res { width: 100%; max-width: 500px; margin-top: 25px; border-radius: 15px; display: none; }
    </style>
</head>
<body>

<header>
    <h1>Привет, я Али 👋</h1>
    <p>Scratch Developer | AI Enthusiast</p>
</header>

<section>
    <h2>AI Image Studio</h2>
    <div class="ai-card">
        <input type="text" id="prompt" class="ai-input" placeholder="Опишите картинку на английском...">
        <br>
        <button onclick="runModel()" id="btn" class="ai-btn">СГЕНЕРИРОВАТЬ</button>
        <p id="status" style="margin-top: 15px; color: var(--neon); font-size: 14px;"></p>
        <center><img id="ai-res" src=""></center>
    </div>
</section>

<script>
async function runModel() {
    const promptInput = document.getElementById('prompt').value;
    const button = document.getElementById('btn');
    const statusText = document.getElementById('status');
    const resultImg = document.getElementById('ai-res');

    if (!promptInput) return alert("Введите описание!");

    button.disabled = true;
    statusText.innerText = "⏳ Нейросеть рисует... (10-15 сек)";
    resultImg.style.display = "none";

    // Используем твой НОВЫЙ токен
    const apiToken = "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";

    try {
        const response = await fetch(
            "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell",
            {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${apiToken.trim()}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ 
                    inputs: promptInput,
                    options: { wait_for_model: true }
                }),
            }
        );

        if (response.status === 401) {
            throw new Error("Токен не включен! Зайди в настройки токена и поставь галочку 'Inference'.");
        }

        if (!response.ok) throw new Error("Ошибка API: " + response.status);

        const blob = await response.blob();
        resultImg.src = URL.createObjectURL(blob);
        resultImg.style.display = "inline-block";
        statusText.innerText = "✅ Готово!";

    } catch (err) {
        console.error(err);
        statusText.innerText = "❌ " + err.message;
    } finally {
        button.disabled = false;
    }
}
</script>
</body>
</html>
