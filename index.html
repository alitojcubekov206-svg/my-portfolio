<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIdent2 Gen — AI Portfolio</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0b0b0b; color: white; font-family: sans-serif; overflow: hidden; }
        .nav { height: 60px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 2px solid #333; }
        .nav button { 
            background: #222; border: 1px solid #444; color: #ccc; padding: 8px 15px; 
            border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .nav button:hover { background: #333; border-color: #00d2ff; }
        .nav button.active { background: #00d2ff; color: #000; border-color: #00d2ff; }
        
        /* Контейнер для фрейма */
        .container { width: 100%; height: calc(100vh - 60px); position: relative; background: #0b0b0b; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Сообщение-подсказка */
        #loader-hint {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px;
            font-size: 12px; color: #00ff88; z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="nav">
    <button id="btn-0" onclick="changeModel(0)">BitDance (Stable)</button>
    <button id="btn-1" onclick="changeModel(1)">Flux Fast</button>
    <button id="btn-2" onclick="changeModel(2)">Magic Gen (SDXL)</button>
</div>

<div class="container">
    <div id="loader-hint">Подключение к серверу...</div>
    <iframe id="ai-frame" 
        src="about:blank" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-today-data-delivery-format-allow-downloads">
    </iframe>
</div>

<script>
    // Самые стабильные зеркала на текущий момент
    const models = [
        'https://shallowdream204-bitdance-14b-64x.hf.space',
        'https://black-forest-labs-flux-1-schnell.hf.space',
        'https://prodia-fast-stable-diffusion.hf.space' // Очень живучий эндпоинт
    ];

    const frame = document.getElementById('ai-frame');
    const hint = document.getElementById('loader-hint');

    function changeModel(index) {
        hint.style.display = 'block';
        hint.innerText = "Запуск модели " + (index + 1) + "... подождите";
        
        frame.src = models[index];
        
        document.querySelectorAll('.nav button').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });

        // Скрываем подсказку через 5 секунд
        setTimeout(() => { hint.style.display = 'none'; }, 5000);
    }

    // Рандомный выбор при входе для распределения 40 человек
    window.onload = function() {
        const randomIndex = Math.floor(Math.random() * models.length);
        changeModel(randomIndex);
    };
</script>

</body>
</html>
