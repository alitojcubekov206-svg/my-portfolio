<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио — Али Тойчубеков</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0b0f;
  --card: #14141c;
  --accent: #ffd700;
  --neon: #7c7cff;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: #fff;
}

a { color: inherit; text-decoration: none; }

/* HEADER */
header {
  text-align: center;
  padding: 90px 20px;
  background: radial-gradient(circle at top, #1a1a2e, #000);
}

header h1 {
  font-size: 3em;
  margin-bottom: 10px;
  color: var(--accent);
}

header p {
  margin: 6px 0;
  opacity: 0.9;
}

.tag {
  margin-top: 15px;
  color: var(--neon);
  font-weight: 600;
  letter-spacing: 1px;
}

/* SECTION */
section {
  max-width: 1200px;
  margin: 60px auto;
  padding: 0 20px;
}

h2 {
  text-align: center;
  font-size: 2.4em;
  margin-bottom: 50px;
  color: var(--accent);
}

/* AI SECTION (NEW) */
.ai-card {
    background: var(--card);
    border-radius: 22px;
    padding: 30px;
    text-align: center;
    border: 2px solid var(--neon);
    box-shadow: 0 0 20px rgba(124,124,255,0.2);
}

.ai-input {
    width: 80%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #0b0b0f;
    color: white;
    margin-bottom: 20px;
    font-family: inherit;
}

.ai-button {
    padding: 12px 25px;
    background: var(--neon);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.ai-button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px var(--neon);
}

#ai-image {
    width: 100%;
    max-width: 500px;
    margin-top: 20px;
    border-radius: 15px;
    display: none;
}

/* PROJECTS */
.projects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.project {
  background: var(--card);
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.project:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow:
    0 0 25px rgba(124,124,255,0.35),
    0 0 50px rgba(255,215,0,0.15);
}

.project h3 {
  margin-top: 0;
  font-size: 1.3em;
  color: var(--accent);
}

.num {
  color: var(--neon);
  font-weight: 700;
  margin-right: 6px;
}

.project p {
  font-size: 0.95em;
  opacity: 0.8;
}

video {
  width: 100%;
  border-radius: 15px;
  margin-top: 10px;
}

/* EMPTY PROJECT */
.empty {
  opacity: 0.5;
  text-align: center;
  font-style: italic;
}

/* CONTACTS */
.contacts {
  text-align: center;
  padding: 70px 20px;
  background: #000;
}
</style>
</head>

<body>

  <p><strong>Али Тойчубеков — 8 класс, школа Таалим</strong></p>
  <p class="tag">🎮 Scratch / Game Developer</p>
</header>
