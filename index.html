<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator | FLUX.1</title>
    <style>
        :root {
            --primary: #8a2be2;
            --bg: #0f0f12;
            --card: #1a1a20;
            --text: #ffffff;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--primary); }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #2a2a35;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }

        .loader {
            display: none;
            margin: 20px 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        #result-container {
            margin-top: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #333;
            border-radius: 15px;
            overflow: hidden;
        }

        #result-img {
            width: 100%;
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор FLUX.1</h1>
    
    <div class="input-group">
        <input type="text" id="prompt" placeholder="Опиши картинку (на английском)..." autocomplete="off">
        <button id="generate-btn">Создать шедевр</button>
    </div>

    <div id="loader" class="loader">✨ Нейросеть думает... Подождите немного</div>

    <div id="result-container">
        <span id="placeholder-text" style="color: #555;">Тут будет ваша картинка</span>
        <img id="result-img" alt="Результат">
    </div>
</div>

<script>
    // 1. ВСТАВЬ СВОЙ ТОКЕН СЮДА (получи на huggingface.co)
    const HF_TOKEN = "ЗДЕСЬ_ТВОЙ_ТОКЕН"; 
    
    // Используем одну из лучших быстрых моделей
    const API_URL = "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell";

    const promptInput = document.getElementById('prompt');
    const genBtn = document.getElementById('generate-btn');
    const loader = document.getElementById('loader');
    const resultImg = document.getElementById('result-img');
    const placeholder = document.getElementById('placeholder-text');

    async function query(data) {
        const response = await fetch(API_URL, {
            headers: { 
                Authorization: `Bearer ${HF_TOKEN}`,
                "Content-Type": "application/json"
            },
            method: "POST",
            body: JSON.stringify(data),
        });

        if (!response.ok) {
            throw new Error("Ошибка API. Проверь токен или подожди минуту.");
        }

        const result = await response.blob();
        return result;
    }

    genBtn.addEventListener('click', async () => {
        const text = promptInput.value.trim();
        
        if (!text) {
            alert("Пожалуйста, введи описание!");
            return;
        }

        if (HF_TOKEN === "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") {
            alert("Ты забыл вставить API токен в коде!");
            return;
        }

        // Состояние загрузки
        genBtn.disabled = true;
        loader.style.display = "block";
        resultImg.style.display = "none";
        placeholder.style.display = "none";

        try {
            const blob = await query({ "inputs": text });
            const imageUrl = URL.createObjectURL(blob);
            
            resultImg.src = imageUrl;
            resultImg.style.display = "block";
        } catch (error) {
            alert(error.message);
            placeholder.style.display = "block";
        } finally {
            genBtn.disabled = false;
            loader.style.display = "none";
        }
    });

    // Генерация по нажатию Enter
    promptInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') genBtn.click();
    });
</script>

</body>
</html>
