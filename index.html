<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Али</title>
    <style>
        :root {
            --bg: #050505;
            --accent: #00d2ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg); color: white;
            font-family: 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden;
        }

        /* Шапка */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
            position: relative;
        }

        .author-tag {
            font-size: 14px;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Навигация */
        .nav { 
            height: 65px; 
            background: rgba(15, 15, 15, 0.9);
            display: flex; align-items: center; 
            padding: 0 20px; gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav::-webkit-scrollbar { display: none; }

        .nav button { 
            white-space: nowrap;
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1); 
            color: #999; padding: 10px 22px; border-radius: 10px;
            cursor: pointer; transition: 0.3s; font-size: 13px; font-weight: 500;
        }

        .nav button:hover { border-color: var(--accent); color: white; }
        .nav button.active { 
            background: var(--accent); color: #000; font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            border-color: var(--accent);
        }

        /* Контейнер для контента */
        .content {
            height: calc(100vh - 125px);
            width: 100%;
            position: relative;
            overflow: hidden; /* Обрезает лишний низ у нейросети */
            background: #000;
        }

        /* Маскировка низа нейросети */
        iframe { 
            width: 100%; 
            height: 108%; /* Делаем чуть выше экрана */
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            display: none;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Чтобы видео не растягивалось */
            display: none; 
        }

        .active-content { display: block !important; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="author-tag">Автор проекта: Али</div>
    <div style="font-size: 11px; color: #444; font-family: monospace;">SYSTEM READY</div>
</div>

<div class="nav">
    <button class="active" onclick="show(0)">🤖 Генерация изображений</button>
</div>

<div class="content">
    <iframe id="c0" class="active-content" src="https://shallowdream204-bitdance-14b-64x.hf.space"></iframe>
    
    <video id="c1" controls loop muted><source src="scratch1.mp4" type="video/mp4"></video>
    <video id="c2" controls loop muted><source src="scratch_project2.mp4" type="video/mp4"></video>
    <video id="c3" controls loop muted><source src="scratch_project.3.mp4" type="video/mp4"></video>
    <video id="c4" controls loop muted><source src="scratch_project4.mp4" type="video/mp4"></video>
    <video id="c5" controls loop muted><source src="scratch_project5.mp4" type="video/mp4"></video>
    <video id="c6" controls loop muted><source src="scratch_project6.mp4" type="video/mp4"></video>
    <video id="c7" controls loop muted><source src="scratch7.mp4" type="video/mp4"></video>
    <video id="c8" controls loop muted><source src="scratch8.mp4" type="video/mp4"></video>
    <video id="c9" controls loop muted><source src="scratch9.mp4" type="video/mp4"></video>
</div>

<script>
    function show(index) {
        // Переключение кнопок
        const btns = document.querySelectorAll('.nav button');
        btns.forEach((b, i) => b.classList.toggle('active', i === index));

        // Скрытие всех элементов и остановка видео
        for(let i=0; i<=9; i++) {
            let el = document.getElementById('c' + i);
            if(el) {
                el.classList.remove('active-content');
                if(el.tagName === 'VIDEO') el.pause();
            }
        }

        // Показ активного элемента
        let active = document.getElementById('c' + index);
        if(active) {
            active.classList.add('active-content');
            if(active.tagName === 'VIDEO') active.play();
        }
    }
</script>

</body>
</html>
