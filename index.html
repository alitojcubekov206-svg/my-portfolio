<script>
    let HF_TOKEN = localStorage.getItem('hf_token_v3');

    if (!HF_TOKEN) {
        HF_TOKEN = prompt("Нужен свежий токен с Hugging Face (Read):");
        if (HF_TOKEN) localStorage.setItem('hf_token_v3', HF_TOKEN.trim());
    }

    // Попробуем SDXL - она часто стабильнее проходит через CORS
    const API_URL = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0";

    async function generate() {
        const promptInput = document.getElementById('prompt');
        const btn = document.getElementById('gen-btn');
        const loader = document.getElementById('loader');
        const resultImg = document.getElementById('result-img');
        const placeholder = document.getElementById('placeholder');

        if (!promptInput.value.trim()) return alert("Напиши что-нибудь!");

        btn.disabled = true;
        loader.style.display = "block";
        resultImg.style.display = "none";
        placeholder.style.display = "none";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${HF_TOKEN.trim()}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ 
                    inputs: promptInput.value.trim(),
                    options: { wait_for_model: true } // Заставляет сервер подождать, если модель "спит"
                }),
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || "Ошибка сервера");
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            
            resultImg.src = url;
            resultImg.style.display = "block";
        } catch (error) {
            console.error(error);
            // Если всё еще Failed to fetch, значит браузер/VPN блокирует запрос
            alert("Не удалось соединиться. Попробуй: \n1. Отключить VPN\n2. Проверить интернет\n3. Использовать другой браузер");
        } finally {
            btn.disabled = false;
            loader.style.display = "none";
        }
    }

    document.getElementById('gen-btn').onclick = generate;
    function resetToken() {
        localStorage.removeItem('hf_token_v3');
        location.reload();
    }
</script>
