<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портфолио — Али</title>
    <style>
        body { background: #0b0b0f; color: white; font-family: sans-serif; text-align: center; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .ai-box { background: #14141c; padding: 30px; border-radius: 20px; border: 2px solid #7c7cff; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }
        button { padding: 10px 20px; background: #7c7cff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #res-img { width: 100%; max-width: 500px; margin-top: 20px; display: none; border-radius: 10px; }
        .projects { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 50px; }
        video { width: 300px; border-radius: 10px; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ali's Portfolio</h1>
        
        <div class="ai-box">
            <h2>BitDance AI Studio</h2>
            <input type="text" id="prompt" placeholder="Описание на английском...">
            <br>
            <button onclick="generate()">СГЕНЕРИРОВАТЬ</button>
            <p id="status"></p>
            <img id="res-img" src="">
        </div>

        <h2>Мои работы</h2>
        <div class="projects">
            <video controls><source src="./scratch1.mp4"></video>
            <video controls><source src="./scratch_project2.mp4"></video>
            <video controls><source src="./scratch_project.3.mp4"></video>
        </div>
    </div>

    <script>
        async function generate() {
            const p = document.getElementById('prompt').value;
            const s = document.getElementById('status');
            const img = document.getElementById('res-img');
            
            if (!p) return alert("Введите текст!");

            // СПРАШИВАЕМ ТОКЕН ТОЛЬКО В МОМЕНТ НАЖАТИЯ
            const token = window.prompt("Вставь свой новый токен Hugging Face сюда:");
            if (!token) return;

            s.innerText = "⏳ Рисую... Жди 1 минуту.";
            img.style.display = "none";

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/shallowdream204/bitdance", {
                    headers: { "Authorization": "Bearer " + token.trim() },
                    method: "POST",
                    body: JSON.stringify({ inputs: p }),
                });

                if (response.ok) {
                    const blob = await response.blob();
                    img.src = URL.createObjectURL(blob);
                    img.style.display = "block";
                    s.innerText = "✅ Готово!";
                } else {
                    s.innerText = "❌ Ошибка. Возможно, модель еще не загрузилась. Попробуй через 30 сек.";
                }
            } catch (e) {
                s.innerText = "❌ Ошибка соединения.";
            }
        }
    </script>
</body>
</html>
