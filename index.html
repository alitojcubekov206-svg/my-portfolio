<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портфолио — Али Тойчубеков</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0b0f; --card: #14141c; --accent: #ffd700; --neon: #7c7cff; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; text-align: center; }
        header { padding: 80px 20px; background: radial-gradient(circle at top, #1a1a2e, #000); }
        h1 { color: var(--accent); }
        section { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .ai-card { background: var(--card); border-radius: 20px; padding: 30px; border: 2px solid var(--neon); }
        .ai-input { width: 85%; padding: 12px; border-radius: 10px; background: #000; color: #fff; margin-bottom: 20px; }
        .ai-btn { padding: 12px 30px; background: var(--neon); color: #fff; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #ai-res { width: 100%; max-width: 500px; margin-top: 25px; border-radius: 15px; display: none; }
        .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .project { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; }
        video { width: 100%; border-radius: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>Привет, я Али 👋</h1>
        <p>Scratch Developer | AI Enthusiast</p>
    </header>
    <section>
        <h2>AI Image Studio</h2>
        <div class="ai-card">
            <input type="text" id="prompt" class="ai-input" placeholder="Введите описание на английском...">
            <br>
            <button onclick="runModel()" id="btn" class="ai-btn">СГЕНЕРИРОВАТЬ</button>
            <p id="status" style="margin-top: 15px; color: var(--neon);"></p>
            <center><img id="ai-res" src=""></center>
        </div>
    </section>
    <script>
        async function runModel() {
            const promptInput = document.getElementById('prompt').value;
            const button = document.getElementById('btn');
            const statusText = document.getElementById('status');
            const resultImg = document.getElementById('ai-res');

            if (!promptInput) return alert("Введите описание!");

            button.disabled = true;
            statusText.innerText = "⏳ Генерация... (10-20 сек)";
            resultImg.style.display = "none";

            const apiToken = "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";

            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell",
                    {
                        method: "POST",
                        headers: { 
                            "Authorization": `Bearer ${apiToken.trim()}`,
                            "Content-Type": "application/json",
                            "x-wait-for-model": "true" 
                        },
                        body: JSON.stringify({ inputs: promptInput }),
                    }
                );

                if (!response.ok) throw new Error("Ошибка API: " + response.status);

                const blob = await response.blob();
                resultImg.src = URL.createObjectURL(blob);
                resultImg.style.display = "inline-block";
                statusText.innerText = "✅ Готово!";
            } catch (err) {
                statusText.innerText = "❌ Ошибка сети. Проверьте права токена ari.";
                console.error(err);
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
