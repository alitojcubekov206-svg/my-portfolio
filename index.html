<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AIdent2 Gen — AI Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #00d2ff; --bg: #0b0b0b; --card: #151515; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 90%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 20px; font-size: 24px; }
        input { width: 100%; padding: 15px; box-sizing: border-box; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; margin-bottom: 15px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #444; cursor: not-allowed; }
        #result-wrapper { margin-top: 20px; min-height: 200px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 10px; overflow: hidden; }
        img { width: 100%; display: none; }
        #log { font-size: 13px; color: #777; margin-top: 15px; }
        .loader { width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <h2>AIdent2 Gen</h2>
    <input type="text" id="prompt" placeholder="Опишите картинку (на англ.)..." autocomplete="off">
    <button id="btn">СОЗДАТЬ МАГИЮ</button>
    <div id="log">Бесплатная генерация через SD XL</div>
    <div id="result-wrapper">
        <div class="loader" id="loader"></div>
        <img id="res">
    </div>
</div>

<script type="module">
    import { HfInference } from 'https://cdn.jsdelivr.net/npm/@huggingface/inference@2.6.4/+esm';

    // Маскируем токен от простых ботов
    const p1 = "hf_";
    const p2 = "kSPftshnKWAnjWPowMkNbYXhAvfjlwzjzq"; // Убедись, что этот токен рабочий!
    
    const hf = new HfInference(p1 + p2);

    const btn = document.getElementById('btn');
    const log = document.getElementById('log');
    const res = document.getElementById('res');
    const loader = document.getElementById('loader');
    const promptInput = document.getElementById('prompt');

    async function generate() {
        const text = promptInput.value.trim();
        if (!text) return alert("Введите текст!");

        btn.disabled = true;
        loader.style.display = "block";
        res.style.display = "none";
        log.innerText = "Нейросеть рисует...";

        try {
            const blob = await hf.textToImage({
                model: 'stabilityai/stable-diffusion-xl-base-1.0',
                inputs: text,
            });

            const url = URL.createObjectURL(blob);
            res.src = url;
            res.onload = () => {
                res.style.display = "block";
                loader.style.display = "none";
                log.innerText = "Готово!";
            };
        } catch (err) {
            loader.style.display = "none";
            log.innerText = "Ошибка (возможно, лимит исчерпан)";
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    }

    btn.onclick = generate;
    promptInput.onkeydown = (e) => { if (e.key === 'Enter') generate(); };
</script>
</body>
</html>
